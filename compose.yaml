name: ros2-drone-sar-autonomy

services:
  px4:
    image: px4io/px4-sitl-gazebo:v1.17.0-alpha1-1551-g381149fb01
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      PX4_SIM_MODEL: ${PX4_SIM_MODEL:-gz_x500_depth}
      PX4_GZ_WORLD: ${PX4_GZ_WORLD:-walls}
      HEADLESS: ${HEADLESS-1}
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      GZ_PARTITION: ${GZ_PARTITION:-drone_sar}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./simulation:/workspace/simulation:ro
      - px4_state:/root/.local/share

  ros:
    image: ros2-drone-sar-autonomy:humble
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    network_mode: host
    init: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RCUTILS_COLORIZED_OUTPUT: "1"
      QT_X11_NO_MITSHM: "1"
      GZ_PARTITION: ${GZ_PARTITION:-drone_sar}
    volumes:
      - .:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ros_cache:/home/rosdev/.cache
    working_dir: /workspace
    command: ["sleep", "infinity"]

volumes:
  px4_state:
  ros_cache:
